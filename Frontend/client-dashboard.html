<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client Dashboard</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Background -->
    <link rel="stylesheet" href="css/background.css">

    <!-- Dashboard -->
    <link rel="stylesheet" href="css/dashboard/dashboard.css">

</head>

<body>

<div id="space-background"></div>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <!-- Logo -->

        <div class="logo">

            <div class="logo-circle"></div>

            <h2>Marketplace</h2>

        </div>

        <!-- Navigation -->

        <nav>

            <a class="active">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <a>
                <i class="fa-solid fa-folder-open"></i>
                Projects
            </a>

            <a>
                <i class="fa-solid fa-gavel"></i>
                Bids
            </a>

            <a>
                <i class="fa-solid fa-comments"></i>
                Messages
            </a>

            <a>
                <i class="fa-solid fa-bell"></i>
                Notifications
            </a>

            <a>
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>

        </nav>

        <!-- Logout -->

        <li id="logoutBtn">
    <i class="fa-solid fa-right-from-bracket"></i>
    Logout
</li>

    </aside>

    <!-- Main -->

    <main class="content">

        <!-- Topbar -->

        <header class="topbar">

            <div>

                <h1>

                    Welcome,

                    <span id="username">Client</span>

                    👋

                </h1>

                <p id="todayDate"></p>

            </div>

            <div class="top-right">

                <div class="search">

                    <i class="fa-solid fa-search"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search">

                </div>

                <button id="newProjectBtn" class="new-btn">
    <i class="fa-solid fa-plus"></i>
    New Project
</button>

                <button class="notify">

                    <i class="fa-solid fa-bell"></i>

                </button>

                <img
                    id="profileImage"
                    src="https://ui-avatars.com/api/?background=6C63FF&color=fff&name=Client">

            </div>

        </header>

        <!-- Dashboard content starts here -->

        <section class="stats">

    <div class="stat-card">
        <h3>Total Projects</h3>
        <h1 id="totalProjects">0</h1>
    </div>

    <div class="stat-card">
        <h3>Active</h3>
        <h1 id="activeProjects">0</h1>
    </div>

    <div class="stat-card">
        <h3>Pending Bids</h3>
        <h1 id="pendingBids">0</h1>
    </div>

    <div class="stat-card">
        <h3>Completed</h3>
        <h1 id="completedProjects">0</h1>
    </div>

</section>

<section class="recent">

    <div class="section-title">

        <h2>Recent Projects</h2>

        <button>

            View All

        </button>

    </div>

    <div id="projectContainer">

    </div>

</section>

    </main>

</div>

<!-- Create Project Modal -->

<div class="modal" id="projectModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Create New Project</h2>

            <button id="closeModal">&times;</button>

        </div>

        <form id="projectForm">

            <input
                id="title"
                type="text"
                placeholder="Project Title"
                required>

            <textarea
                id="description"
                placeholder="Project Description"
                required></textarea>

            <input
                id="budget"
                type="number"
                placeholder="Budget">

            <input
                id="category"
                type="text"
                placeholder="Category">

            <input
                id="skills"
                type="text"
                placeholder="React, Node, MongoDB">

            <input
                id="deadline"
                type="date">

            <button type="submit">

                Create Project

            </button>

        </form>

    </div>

</div>

<!-- Project Drawer -->

<div id="projectDrawer" class="drawer">

    <div class="drawer-content">

        <div class="drawer-header">

            <h2>Project Details</h2>

            <button id="closeDrawer">&times;</button>

        </div>

        <div id="drawerBody">

        </div>

    </div>

</div>

<script src="js/background.js"></script>

<script src="js/dashboard/dashboard.js"></script>

<script src="js/dashboard/project.js"></script>

<script src="js/dashboard/ui.js"></script>

<script src="js/dashboard/auth.js"></script>

</body>

</html>
